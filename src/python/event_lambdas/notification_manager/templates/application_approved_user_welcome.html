<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; line-height: 1.6; color: #333; }
  .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
  .header { background-color: #28a745; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
  .content { padding: 25px; }
  .footer { font-size: 0.8em; text-align: center; color: #777; margin-top: 20px; }
  .login-button { display: inline-block; background-color: #007bff; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; margin-top: 15px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header"><h2>Welcome to CUE!</h2></div>
    <div class="content">
      <p>Hello {{ user_name }},</p>
      <p>Your application for access to the Cloud Upload Environment (CUE) has been approved. You can now log in to the dashboard using the button below.</p>
      <a href="{{ dashboard_url }}" class="login-button">Login to CUE Dashboard</a>
    </div>
    <div class="footer"><p>This is an automated message from the CUE system.</p></div>
  </div>
</body>
</html>
